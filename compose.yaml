services:
  db:
    image: postgres:17.9
    environment:
      POSTGRES_USER: action_note_api_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: action_note_api_development
    ports:
      - "5432:5432"
    volumes:
    - db_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - .:/action-note-api
      - bundle_data:/usr/local/bundle

volumes:
    db_data:
    bundle_data: